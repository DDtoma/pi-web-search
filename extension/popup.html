<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	body {
		font: 13px/1.4 system-ui, sans-serif;
		min-width: 260px;
		max-width: 360px;
		margin: 0;
		padding: 8px;
	}
	.status { padding: 4px 6px; color: #5f6368; }
	.status.ok { color: #1a73e8; }
	ul { list-style: none; margin: 0; padding: 0; }
	li {
		padding: 6px;
		border-radius: 6px;
		cursor: pointer;
	}
	li:hover { background: #f1f3f4; }
	li.stale .title { color: #9aa0a6; }
	li.port { display: flex; align-items: center; justify-content: space-between; cursor: default; }
	li.port:hover { background: none; }
	.release {
		border: 1px solid #dadce0;
		border-radius: 4px;
		background: #fff;
		color: #1a73e8;
		padding: 2px 8px;
		cursor: pointer;
		font-size: 12px;
	}
	.release:disabled { color: #9aa0a6; cursor: default; }
	.title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.meta { color: #5f6368; font-size: 12px; }
</style>
</head>
<body>
	<div id="status" class="status">…</div>
	<ul id="ports"></ul>
	<ul id="sessions"></ul>
	<script src="popup.js"></script>
</body>
</html>
