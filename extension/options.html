<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>pi Web Search Bridge 设置</title>
<style>
	body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #222; }
	h1 { font-size: 18px; }
	h2 { font-size: 14px; margin-top: 24px; }
	label { display: block; margin: 10px 0 4px; font-size: 13px; }
	input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; }
	.row { margin: 10px 0; font-size: 13px; }
	button { margin-top: 16px; padding: 8px 20px; font-size: 13px; }
	#status { margin-left: 12px; font-size: 13px; color: #067d17; }
	.hint { font-size: 12px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<h1>pi Web Search Bridge</h1>

<h2>扩展内 LLM 摘要（可选）</h2>
<div class="row">
	<label><input type="checkbox" id="llmEnabled" /> 启用</label>
	<div class="hint">启用后，带 question 的 web_fetch 会在扩展侧对每页调用下面的 OpenAI 兼容端点做摘要，只回传摘要，减少主 agent 的上下文压力。未启用时回传页面正文。</div>
</div>
<label for="baseUrl">Base URL</label>
<input type="text" id="baseUrl" placeholder="https://api.openai.com/v1" />
<label for="apiKey">API Key</label>
<input type="password" id="apiKey" />
<label for="model">Model</label>
<input type="text" id="model" placeholder="gpt-4o-mini" />

<h2>标签组</h2>
<div class="row">
	<label><input type="checkbox" id="closeGroupOnSessionEnd" /> pi 会话结束时自动关闭对应标签组</label>
	<div class="hint">默认保留（会话结束后可能还要翻页面）。无论是否勾选，超过 24 小时无活动的标签组都会自动回收。</div>
</div>

<button id="save">保存</button><span id="status"></span>
<script src="options.js"></script>
</body>
</html>
